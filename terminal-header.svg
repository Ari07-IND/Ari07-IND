<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1200 620"
  width="1200"
  height="620"
  font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Monaco, Consolas, Liberation Mono, monospace">

  <title>Aritra Chatterjee — Premium Tor Interface</title>

  <defs>

    <!-- Deep, cinematic dark background -->
    <linearGradient id="bgGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#120c1a"/>
      <stop offset="1" stop-color="#050308"/>
    </linearGradient>

    <!-- Subtle radial glow behind the text to create depth -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A970FF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#A970FF" stop-opacity="0"/>
    </radialGradient>

    <!-- Sleek Name Gradient -->
    <linearGradient id="nameGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D4B5FF"/>
      <stop offset="0.3" stop-color="#ffffff"/>
      <stop offset="0.7" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#60E185"/>
    </linearGradient>

    <!-- Browser Tab Gradient -->
    <linearGradient id="tabGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c132b"/>
      <stop offset="1" stop-color="#120c1a"/>
    </linearGradient>

    <!-- Glowing Bottom Accent Line -->
    <linearGradient id="neonAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A970FF" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#A970FF" stop-opacity="1"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="0.8" stop-color="#60E185" stop-opacity="1"/>
      <stop offset="1" stop-color="#60E185" stop-opacity="0"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="strongGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Window Clipping Mask -->
    <clipPath id="terminalClip">
      <rect x="25" y="25" width="1150" height="570" rx="12"/>
    </clipPath>

    <!-- Cascading Reveal Masks for the Data -->
    <clipPath id="revealRow1">
      <rect x="0" y="190" width="0" height="40">
        <animate attributeName="width" from="0" to="1120" dur="0.8s" begin="8.5s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.25 0.1 0.25 1"/>
      </rect>
    </clipPath>
    <clipPath id="revealRow2">
      <rect x="0" y="230" width="0" height="40">
        <animate attributeName="width" from="0" to="1120" dur="0.8s" begin="8.8s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.25 0.1 0.25 1"/>
      </rect>
    </clipPath>
    <clipPath id="revealRow3">
      <rect x="0" y="270" width="0" height="40">
        <animate attributeName="width" from="0" to="1120" dur="0.8s" begin="9.1s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.25 0.1 0.25 1"/>
      </rect>
    </clipPath>
    <clipPath id="revealRow4">
      <rect x="0" y="310" width="0" height="40">
        <animate attributeName="width" from="0" to="1120" dur="0.8s" begin="9.4s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.25 0.1 0.25 1"/>
      </rect>
    </clipPath>
    <clipPath id="revealRow5">
      <rect x="0" y="350" width="0" height="40">
        <animate attributeName="width" from="0" to="1120" dur="0.8s" begin="9.7s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.25 0.1 0.25 1"/>
      </rect>
    </clipPath>
    <clipPath id="revealRow6">
      <rect x="0" y="390" width="0" height="40">
        <animate attributeName="width" from="0" to="1120" dur="0.8s" begin="10.0s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.25 0.1 0.25 1"/>
      </rect>
    </clipPath>

  </defs>

  <!-- =========================================================
       WINDOW & BACKGROUND
       ========================================================= -->
  <rect x="35" y="35" width="1150" height="570" rx="12" fill="#000000" opacity="0.75" filter="url(#softGlow)"/>
  <rect x="25" y="25" width="1150" height="570" rx="12" fill="url(#bgGradient)" stroke="#32224d" stroke-width="1.5"/>
  <circle cx="600" cy="350" r="400" fill="url(#centerGlow)" clip-path="url(#terminalClip)"/>

  <!-- =========================================================
       PREMIUM BROWSER UI
       ========================================================= -->
  <rect x="25" y="25" width="1150" height="48" fill="#08050d" clip-path="url(#terminalClip)"/>
  <line x1="25" y1="73" x2="1175" y2="73" stroke="#1c132b"/>

  <g transform="translate(45, 49)">
    <circle cx="0" cy="0" r="6" fill="#ff5f56" stroke="#e0443e" stroke-width="0.5"/>
    <circle cx="22" cy="0" r="6" fill="#ffbd2e" stroke="#dea123" stroke-width="0.5"/>
    <circle cx="44" cy="0" r="6" fill="#27c93f" stroke="#1aab29" stroke-width="0.5"/>
  </g>

  <rect x="110" y="35" width="220" height="38" rx="8" fill="url(#tabGradient)" stroke="#32224d" stroke-width="1"/>
  
  <g transform="translate(130, 54)">
    <circle cx="0" cy="0" r="5" fill="none" stroke="#A970FF" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="2.5" fill="none" stroke="#A970FF" stroke-width="1"/>
    <path d="M0 -9 L0 -5" stroke="#60E185" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  <text x="145" y="58" font-size="12" fill="#e5d9f2" font-weight="500">aritra.onion — Secure</text>

  <rect x="25" y="73" width="1150" height="52" fill="#120c1a"/>
  <line x1="25" y1="125" x2="1175" y2="125" stroke="#25173b"/>

  <rect x="110" y="83" width="980" height="32" rx="16" fill="#09050d" stroke="#32224d" stroke-width="1.2"/>
  
  <g transform="translate(130, 93)" fill="none" stroke="#60E185" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="4" width="10" height="7" rx="1.5"/>
    <path d="M2 4 V2.5 A3 3 0 0 1 8 2.5 V4"/>
  </g>

  <text x="155" y="104" font-size="13" fill="#A970FF" letter-spacing="0.5">
    http://aritra<tspan fill="#685682">3x2q5z7v9w1b2n3m4p5o6.onion</tspan>
  </text>

  <!-- =========================================================
       BOOT SEQUENCE
       ========================================================= -->
  <g id="bootSequence">
    <text x="60" y="175" font-size="14" font-weight="700" fill="#A970FF" opacity="0">
      &gt; ESTABLISHING ENCRYPTED ONION CIRCUIT...
      <animate attributeName="opacity" values="0;1" dur=".4s" begin=".4s" fill="freeze"/>
    </text>

    <g font-size="13">
      <g opacity="0">
        <animate attributeName="opacity" values="0;1" dur=".3s" begin="1s" fill="freeze"/>
        <text x="60" y="215"><tspan fill="#60E185">[ OK ]</tspan></text>
        <text x="120" y="215" fill="#685682">0x00A1</text>
        <text x="180" y="215" fill="#c4b5d4">[ Guard Relay ]</text>
        <text x="320" y="215" fill="#685682">................................ connection-established</text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" values="0;1" dur=".3s" begin="1.4s" fill="freeze"/>
        <text x="60" y="240"><tspan fill="#60E185">[ OK ]</tspan></text>
        <text x="120" y="240" fill="#685682">0x1B2C</text>
        <text x="180" y="240" fill="#c4b5d4">[ Middle Node ]</text>
        <text x="320" y="240" fill="#685682">................................ tunnel-bypassed</text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" values="0;1" dur=".3s" begin="1.8s" fill="freeze"/>
        <text x="60" y="265"><tspan fill="#60E185">[ OK ]</tspan></text>
        <text x="120" y="265" fill="#685682">0x3F4A</text>
        <text x="180" y="265" fill="#c4b5d4">[ Exit Node   ]</text>
        <text x="320" y="265" fill="#685682">................................ traffic-anonymized</text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" values="0;1" dur=".3s" begin="2.2s" fill="freeze"/>
        <text x="60" y="290"><tspan fill="#60E185">[ OK ]</tspan></text>
        <text x="120" y="290" fill="#685682">0x77DA</text>
        <text x="180" y="290" fill="#c4b5d4">[ Rendezvous  ]</text>
        <text x="320" y="290" fill="#685682">................................ point-reached</text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" values="0;1" dur=".3s" begin="2.6s" fill="freeze"/>
        <text x="60" y="315"><tspan fill="#60E185">[ OK ]</tspan></text>
        <text x="120" y="315" fill="#685682">0xFF00</text>
        <text x="180" y="315" fill="#c4b5d4">[ Security    ]</text>
        <text x="320" y="315" fill="#685682">................................ encryption-active</text>
      </g>
    </g>

    <rect x="60" y="350" width="750" height="6" rx="3" fill="#110b1a" stroke="#2d1c47" opacity="0">
      <animate attributeName="opacity" values="0;1" dur=".3s" begin="3.1s" fill="freeze"/>
    </rect>
    <rect x="60" y="350" width="0" height="6" rx="3" fill="#A970FF" filter="url(#softGlow)">
      <animate attributeName="width" from="0" to="750" dur="1.5s" begin="3.1s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.4 0 0.2 1"/>
    </rect>

    <text x="60" y="395" font-size="15" font-weight="700" fill="#60E185" filter="url(#softGlow)" opacity="0">
      ONION CIRCUIT ESTABLISHED
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.2;.7;1" dur="1.2s" begin="4.8s" fill="freeze"/>
    </text>

    <!-- Fade out entire boot sequence -->
    <animate attributeName="opacity" values="1;1;1;0" keyTimes="0;.76;.88;1" dur="1.5s" begin="4.8s" fill="freeze"/>
  </g>

  <!-- =========================================================
       TERMINAL SESSION (The Unified Data Output)
       ========================================================= -->
  <g id="terminalSession" opacity="0">
    <animate attributeName="opacity" values="0;1" dur=".6s" begin="6.1s" fill="freeze"/>

    <!-- Command: whoami -->
    <text x="60" y="175" font-size="16">
      <tspan fill="#A970FF" font-weight="700">aritra@hidden-service:~$</tspan>
      <tspan fill="#e5d9f2"> whoami</tspan>
    </text>

    <!-- Typing Cursor for whoami -->
    <rect x="300" y="161" width="9" height="18" fill="#A970FF">
      <animate attributeName="opacity" values="1;0;1;0" dur=".8s" begin="6.2s" repeatCount="3"/>
    </rect>

    <!-- Line 1: Identity (Highlight with custom gradient) -->
    <g clip-path="url(#revealRow1)">
      <text x="90" y="215" font-size="15" fill="#A970FF" font-weight="600" letter-spacing="1">IDENTITY</text>
      <text x="215" y="215" font-size="15" fill="#5c4b75">::</text>
      <text x="250" y="215" font-size="22" font-weight="900" letter-spacing="2" fill="url(#nameGradient)" filter="url(#strongGlow)">
        ARITRA CHATTERJEE
      </text>
    </g>

    <!-- Line 2: Degree -->
    <g clip-path="url(#revealRow2)">
      <text x="90" y="255" font-size="15" fill="#A970FF" font-weight="600" letter-spacing="1">DEGREE</text>
      <text x="215" y="255" font-size="15" fill="#5c4b75">::</text>
      <text x="250" y="255" font-size="15" fill="#e5d9f2">B.Tech CSE (AI)</text>
    </g>

    <!-- Line 3: Institute & University -->
    <g clip-path="url(#revealRow3)">
      <text x="90" y="295" font-size="15" fill="#A970FF" font-weight="600" letter-spacing="1">INSTITUTE</text>
      <text x="215" y="295" font-size="15" fill="#5c4b75">::</text>
      <text x="250" y="295" font-size="15" fill="#e5d9f2">IEM Newtown <tspan fill="#685682"> // </tspan> UEM Kolkata</text>
    </g>

    <!-- Line 4: Focus -->
    <g clip-path="url(#revealRow4)">
      <text x="90" y="335" font-size="15" fill="#A970FF" font-weight="600" letter-spacing="1">FOCUS</text>
      <text x="215" y="335" font-size="15" fill="#5c4b75">::</text>
      <text x="250" y="335" font-size="15" fill="#60E185" filter="url(#softGlow)">Artificial Intelligence</text>
    </g>

    <!-- Line 5: Domains -->
    <g clip-path="url(#revealRow5)">
      <text x="90" y="375" font-size="15" fill="#A970FF" font-weight="600" letter-spacing="1">DOMAINS</text>
      <text x="215" y="375" font-size="15" fill="#5c4b75">::</text>
      <text x="250" y="375" font-size="15" fill="#e5d9f2">AI <tspan fill="#685682">/</tspan> ML <tspan fill="#685682">/</tspan> Robotics</text>
    </g>

    <!-- Line 6: Status -->
    <g clip-path="url(#revealRow6)">
      <text x="90" y="415" font-size="15" fill="#A970FF" font-weight="600" letter-spacing="1">STATUS</text>
      <text x="215" y="415" font-size="15" fill="#5c4b75">::</text>
      <text x="250" y="415" font-size="15" fill="#60E185" font-weight="700">[ ACTIVE / BUILDING ]</text>
    </g>

    <!-- Final Prompt -->
    <text x="60" y="485" font-size="15" opacity="0">
      <tspan fill="#A970FF" font-weight="700">aritra@hidden-service:~$</tspan>
      <tspan fill="#e5d9f2"> echo "always building."</tspan>
      <animate attributeName="opacity" values="0;1" dur=".4s" begin="11.5s" fill="freeze"/>
    </text>

    <!-- Final Blinking Cursor -->
    <rect x="365" y="471" width="9" height="17" rx="1" fill="#A970FF" opacity="0" filter="url(#softGlow)">
      <animate attributeName="opacity" values="0;1;0;1;0" dur="1s" begin="11.8s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Glowing Accent Line at the very bottom -->
  <rect x="25" y="593" width="0" height="2" fill="url(#neonAccent)" filter="url(#softGlow)">
    <animate attributeName="width" from="0" to="1150" dur="1.8s" begin="6.1s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.4 0 0.2 1"/>
  </rect>

</svg>
