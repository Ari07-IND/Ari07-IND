<svg
  viewBox="0 0 1000 500"
  xmlns="http://www.w3.org/2000/svg"
  font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">

  <title>Aritra Linux — AI/ML · Robotics · Research</title>

  <defs>

    <!-- =========================================================
         COLOR SYSTEM
         ========================================================= -->

    <linearGradient id="greenGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7ee787" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#7ee787" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#7ee787" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="nameGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#d7ffe0"/>
      <stop offset="1" stop-color="#7ee787"/>
    </linearGradient>

    <linearGradient id="scanGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ee787" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#7ee787" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#7ee787" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="bootGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#238636"/>
      <stop offset="1" stop-color="#7ee787"/>
    </linearGradient>

    <!-- =========================================================
         GLOW FILTER
         ========================================================= -->

    <filter
      id="terminalGlow"
      x="-100%"
      y="-100%"
      width="300%"
      height="300%">

      <feGaussianBlur
        stdDeviation="2.8"
        result="blur"/>

      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>

    </filter>

    <filter
      id="softGlow"
      x="-100%"
      y="-100%"
      width="300%"
      height="300%">

      <feGaussianBlur
        stdDeviation="8"
        result="blur"/>

      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>

    </filter>

    <!-- =========================================================
         TERMINAL CLIP
         ========================================================= -->

    <clipPath id="terminalClip">

      <rect
        x="45"
        y="22"
        width="910"
        height="456"
        rx="15"/>

    </clipPath>


    <!-- =========================================================
         BOOT TEXT TYPING
         ========================================================= -->

    <clipPath id="bootTyping">

      <rect
        x="78"
        y="104"
        width="0"
        height="25">

        <animate
          attributeName="width"
          from="0"
          to="410"
          dur="1.3s"
          begin="0.5s"
          fill="freeze"/>

      </rect>

    </clipPath>


    <!-- =========================================================
         LOGIN TYPING
         ========================================================= -->

    <clipPath id="loginTyping">

      <rect
        x="78"
        y="300"
        width="0"
        height="25">

        <animate
          attributeName="width"
          from="0"
          to="390"
          dur="1.1s"
          begin="7.8s"
          fill="freeze"/>

      </rect>

    </clipPath>

  </defs>


  <!-- =========================================================
       SHADOW
       ========================================================= -->

  <rect
    x="53"
    y="30"
    width="910"
    height="456"
    rx="15"
    fill="#010409"
    opacity="0.95"/>


  <!-- =========================================================
       MAIN TERMINAL
       ========================================================= -->

  <rect
    x="45"
    y="22"
    width="910"
    height="456"
    rx="15"
    fill="#0d1117"
    stroke="#30363d"
    stroke-width="1"/>


  <!-- =========================================================
       CRT SCANLINE
       ========================================================= -->

  <g clip-path="url(#terminalClip)">

    <rect
      x="45"
      y="-100"
      width="910"
      height="110"
      fill="url(#scanGradient)">

      <animate
        attributeName="y"
        from="-100"
        to="478"
        dur="4.2s"
        begin="0s"
        repeatCount="indefinite"/>

    </rect>

  </g>


  <!-- =========================================================
       SUBTLE BACKGROUND GRID
       ========================================================= -->

  <g
    stroke="#7ee787"
    stroke-opacity="0.025"
    stroke-width="1">

    <path d="M70 80H930"/>
    <path d="M70 120H930"/>
    <path d="M70 160H930"/>
    <path d="M70 200H930"/>
    <path d="M70 240H930"/>
    <path d="M70 280H930"/>
    <path d="M70 320H930"/>
    <path d="M70 360H930"/>
    <path d="M70 400H930"/>
    <path d="M70 440H930"/>

  </g>


  <!-- =========================================================
       TITLE BAR
       ========================================================= -->

  <path
    d="
      M45 62
      V37
      A15 15 0 0 1 60 22
      H940
      A15 15 0 0 1 955 37
      V62
      Z"
    fill="#161b22"/>


  <line
    x1="45"
    y1="62"
    x2="955"
    y2="62"
    stroke="#21262d"/>


  <rect
    x="45"
    y="61"
    width="910"
    height="1"
    fill="url(#greenGlow)"/>


  <!-- =========================================================
       TERMINAL BUTTONS
       ========================================================= -->

  <circle
    cx="74"
    cy="43"
    r="6.5"
    fill="#ff5f56"/>

  <circle
    cx="97"
    cy="43"
    r="6.5"
    fill="#ffbd2e"/>

  <circle
    cx="120"
    cy="43"
    r="6.5"
    fill="#27c93f"/>


  <!-- =========================================================
       WINDOW TITLE
       ========================================================= -->

  <text
    x="500"
    y="47.5"
    text-anchor="middle"
    font-size="12"
    fill="#8b949e">

    aritra@github: ~ — bash

  </text>


  <!-- =========================================================
       STAGE 1
       LINUX BOOT LOGO
       ========================================================= -->

  <g>

    <!-- boot logo -->

    <text
      x="500"
      y="112"
      text-anchor="middle"
      font-size="25"
      font-weight="700"
      letter-spacing="3"
      fill="#7ee787"
      opacity="0">

      ARITRA LINUX

      <animate
        attributeName="opacity"
        values="0;1;1;0"
        keyTimes="0;.1;.72;1"
        dur="6.5s"
        begin="0s"
        fill="freeze"/>

    </text>


    <text
      x="500"
      y="137"
      text-anchor="middle"
      font-size="11"
      letter-spacing="2"
      fill="#8b949e"
      opacity="0">

      SECURE ARTIFICIAL INTELLIGENCE DEVELOPMENT ENVIRONMENT

      <animate
        attributeName="opacity"
        values="0;1;1;0"
        keyTimes="0;.1;.72;1"
        dur="6.5s"
        begin="0s"
        fill="freeze"/>

    </text>


    <!-- boot command -->

    <g clip-path="url(#bootTyping)">

      <text
        x="78"
        y="178"
        font-size="15">

        <tspan fill="#7ee787">
          root@aritra:~#
        </tspan>

        <tspan fill="#c9d1d9">
          ./initialize.sh
        </tspan>

      </text>

    </g>


    <!-- boot messages -->

    <g font-size="12.5">

      <text
        x="78"
        y="205"
        fill="#7ee787"
        opacity="0">

        [ OK ] hardware abstraction layer

        <animate
          attributeName="opacity"
          to="1"
          begin="1.9s"
          dur=".25s"
          fill="freeze"/>

      </text>


      <text
        x="78"
        y="225"
        fill="#7ee787"
        opacity="0">

        [ OK ] linux kernel environment

        <animate
          attributeName="opacity"
          to="1"
          begin="2.25s"
          dur=".25s"
          fill="freeze"/>

      </text>


      <text
        x="78"
        y="245"
        fill="#7ee787"
        opacity="0">

        [ OK ] python / ai runtime

        <animate
          attributeName="opacity"
          to="1"
          begin="2.6s"
          dur=".25s"
          fill="freeze"/>

      </text>


      <text
        x="78"
        y="265"
        fill="#7ee787"
        opacity="0">

        [ OK ] computer vision subsystem

        <animate
          attributeName="opacity"
          to="1"
          begin="2.95s"
          dur=".25s"
          fill="freeze"/>

      </text>


      <text
        x="78"
        y="285"
        fill="#7ee787"
        opacity="0">

        [ OK ] robotics / embedded stack

        <animate
          attributeName="opacity"
          to="1"
          begin="3.3s"
          dur=".25s"
          fill="freeze"/>

      </text>


      <text
        x="78"
        y="305"
        fill="#7ee787"
        opacity="0">

        [ OK ] research environment

        <animate
          attributeName="opacity"
          to="1"
          begin="3.65s"
          dur=".25s"
          fill="freeze"/>

      </text>

    </g>


    <!-- progress bar -->

    <rect
      x="78"
      y="330"
      width="840"
      height="5"
      rx="2.5"
      fill="#21262d"
      opacity="0">

      <animate
        attributeName="opacity"
        to="1"
        begin="4s"
        dur=".2s"
        fill="freeze"/>

    </rect>


    <rect
      x="78"
      y="330"
      width="0"
      height="5"
      rx="2.5"
      fill="url(#bootGradient)"
      filter="url(#terminalGlow)">

      <animate
        attributeName="width"
        from="0"
        to="840"
        dur="1.6s"
        begin="4.05s"
        fill="freeze"/>

    </rect>


    <text
      x="78"
      y="357"
      font-size="11"
      fill="#8b949e"
      opacity="0">

      initializing user environment...

      <animate
        attributeName="opacity"
        to="1"
        begin="4.1s"
        dur=".3s"
        fill="freeze"/>

    </text>


    <text
      x="918"
      y="357"
      text-anchor="end"
      font-size="11"
      fill="#7ee787"
      opacity="0">

      100%

      <animate
        attributeName="opacity"
        to="1"
        begin="5.55s"
        dur=".3s"
        fill="freeze"/>

    </text>

  </g>


  <!-- =========================================================
       STAGE 2
       AUTHENTICATION
       ========================================================= -->

  <g>

    <rect
      x="45"
      y="22"
      width="910"
      height="456"
      rx="15"
      fill="#0d1117"
      opacity="0">

      <animate
        attributeName="opacity"
        values="0;0;1;1;0"
        keyTimes="0;.68;.73;.94;1"
        dur="10s"
        begin="0s"
        fill="freeze"/>

      </rect>


    <text
      x="78"
      y="105"
      font-size="15"
      fill="#7ee787"
      opacity="0">

      aritra@github:~$ login

      <animate
        attributeName="opacity"
        to="1"
        begin="6.7s"
        dur=".3s"
        fill="freeze"/>

    </text>


    <text
      x="78"
      y="140"
      font-size="13"
      fill="#8b949e"
      opacity="0">

      Authenticating development environment...

      <animate
        attributeName="opacity"
        to="1"
        begin="7.05s"
        dur=".3s"
        fill="freeze"/>

    </text>


    <!-- authentication progress -->

    <rect
      x="78"
      y="165"
      width="840"
      height="5"
      rx="2.5"
      fill="#21262d"
      opacity="0">

      <animate
        attributeName="opacity"
        to="1"
        begin="7.4s"
        dur=".2s"
        fill="freeze"/>

    </rect>


    <rect
      x="78"
      y="165"
      width="0"
      height="5"
      rx="2.5"
      fill="#7ee787"
      filter="url(#terminalGlow)">

      <animate
        attributeName="width"
        from="0"
        to="840"
        dur="1.4s"
        begin="7.45s"
        fill="freeze"/>

    </rect>


    <text
      x="78"
      y="195"
      font-size="12"
      fill="#7ee787"
      opacity="0">

      [ OK ] identity verified

      <animate
        attributeName="opacity"
        to="1"
        begin="8.95s"
        dur=".3s"
        fill="freeze"/>

    </text>


    <text
      x="78"
      y="220"
      font-size="12"
      fill="#7ee787"
      opacity="0">

      [ OK ] profile environment mounted

      <animate
        attributeName="opacity"
        to="1"
        begin="9.3s"
        dur=".3s"
        fill="freeze"/>

    </text>


    <text
      x="78"
      y="245"
      font-size="12"
      fill="#7ee787"
      opacity="0">

      [ OK ] welcome, Aritra

      <animate
        attributeName="opacity"
        to="1"
        begin="9.65s"
        dur=".3s"
        fill="freeze"/>

    </text>

  </g>


  <!-- =========================================================
       STAGE 3
       FINAL PROFILE TERMINAL
       ========================================================= -->

  <g>

    <!-- dark overlay -->

    <rect
      x="45"
      y="22"
      width="910"
      height="456"
      rx="15"
      fill="#0d1117"
      opacity="0">

      <animate
        attributeName="opacity"
        values="0;0;1;1"
        keyTimes="0;.92;.96;1"
        dur="12s"
        begin="0s"
        fill="freeze"/>

    </rect>


    <!-- command -->

    <text
      x="78"
      y="105"
      font-size="15"
      opacity="0">

      <tspan fill="#7ee787">
        aritra@github:~$
      </tspan>

      <tspan fill="#c9d1d9">
        whoami
      </tspan>

      <animate
        attributeName="opacity"
        to="1"
        begin="10.6s"
        dur=".4s"
        fill="freeze"/>

    </text>


    <!-- name -->

    <text
      x="78"
      y="150"
      font-size="31"
      font-weight="700"
      letter-spacing="1"
      fill="url(#nameGradient)"
      opacity="0">

      Aritra Chatterjee

      <animate
        attributeName="opacity"
        to="1"
        begin="11s"
        dur=".5s"
        fill="freeze"/>

    </text>


    <!-- underline -->

    <rect
      x="78"
      y="161"
      width="0"
      height="3"
      rx="2"
      fill="#7ee787"
      filter="url(#terminalGlow)">

      <animate
        attributeName="width"
        from="0"
        to="315"
        dur=".6s"
        begin="11.5s"
        fill="freeze"/>

    </rect>


    <!-- identity -->

    <text
      x="78"
      y="190"
      font-size="13.5"
      fill="#8b949e"
      opacity="0">

      B.Tech CSE (AI) · IEM Newtown · UEM Kolkata

      <animate
        attributeName="opacity"
        to="1"
        begin="11.9s"
        dur=".4s"
        fill="freeze"/>

    </text>


    <!-- command -->

    <text
      x="78"
      y="225"
      font-size="15"
      opacity="0">

      <tspan fill="#7ee787">
        aritra@github:~$
      </tspan>

      <tspan fill="#c9d1d9">
        ./system-check.sh
      </tspan>

      <animate
        attributeName="opacity"
        to="1"
        begin="12.3s"
        dur=".4s"
        fill="freeze"/>

    </text>


    <!-- status lines -->

    <g font-size="13.5">

      <text
        x="78"
        y="260"
        fill="#7ee787"
        opacity="0">

        ✓

        <animate
          attributeName="opacity"
          to="1"
          begin="12.8s"
          dur=".25s"
          fill="freeze"/>

      </text>

      <text
        x="100"
        y="260"
        fill="#c9d1d9"
        opacity="0">

        artificial intelligence
        <tspan fill="#30363d"> ................. </tspan>
        <tspan fill="#7ee787">ONLINE</tspan>

        <animate
          attributeName="opacity"
          to="1"
          begin="12.8s"
          dur=".25s"
          fill="freeze"/>

      </text>


      <text
        x="78"
        y="287"
        fill="#7ee787"
        opacity="0">

        ✓

        <animate
          attributeName="opacity"
          to="1"
          begin="13.15s"
          dur=".25s"
          fill="freeze"/>

      </text>

      <text
        x="100"
        y="287"
        fill="#c9d1d9"
        opacity="0">

        computer vision
        <tspan fill="#30363d"> .................... </tspan>
        <tspan fill="#7ee787">ONLINE</tspan>

        <animate
          attributeName="opacity"
          to="1"
          begin="13.15s"
          dur=".25s"
          fill="freeze"/>

      </text>


      <text
        x="78"
        y="314"
        fill="#7ee787"
        opacity="0">

        ✓

        <animate
          attributeName="opacity"
          to="1"
          begin="13.5s"
          dur=".25s"
          fill="freeze"/>

      </text>

      <text
        x="100"
        y="314"
        fill="#c9d1d9"
        opacity="0">

        robotics / embedded
        <tspan fill="#30363d"> ................ </tspan>
        <tspan fill="#7ee787">ACTIVE</tspan>

        <animate
          attributeName="opacity"
          to="1"
          begin="13.5s"
          dur=".25s"
          fill="freeze"/>

      </text>


      <text
        x="78"
        y="341"
        fill="#7ee787"
        opacity="0">

        ✓

        <animate
          attributeName="opacity"
          to="1"
          begin="13.85s"
          dur=".25s"
          fill="freeze"/>

      </text>

      <text
        x="100"
        y="341"
        fill="#c9d1d9"
        opacity="0">

        research / innovation
        <tspan fill="#30363d"> ............... </tspan>
        <tspan fill="#7ee787">RUNNING</tspan>

        <animate
          attributeName="opacity"
          to="1"
          begin="13.85s"
          dur=".25s"
          fill="freeze"/>

      </text>

    </g>


    <!-- final prompt -->

    <text
      x="78"
      y="390"
      font-size="14"
      fill="#7ee787"
      opacity="0">

      aritra@github:~$

      <animate
        attributeName="opacity"
        to="1"
        begin="14.4s"
        dur=".4s"
        fill="freeze"/>

    </text>


    <!-- blinking cursor -->

    <rect
      x="220"
      y="377"
      width="9"
      height="17"
      fill="#7ee787"
      filter="url(#terminalGlow)"
      opacity="0">

      <animate
        attributeName="opacity"
        values="1;1;0;0"
        keyTimes="0;.5;.5;1"
        dur="1.05s"
        begin="14.8s"
        repeatCount="indefinite"/>

    </rect>

  </g>


  <!-- =========================================================
       OUTER CRT GLOW
       ========================================================= -->

  <rect
    x="45"
    y="22"
    width="910"
    height="456"
    rx="15"
    fill="none"
    stroke="#7ee787"
    stroke-width="1.5"
    filter="url(#terminalGlow)"
    opacity=".08">

    <animate
      attributeName="opacity"
      values=".08;.30;.08"
      dur="3.5s"
      repeatCount="indefinite"/>

  </rect>


  <!-- =========================================================
       BOTTOM GLOW
       ========================================================= -->

  <rect
    x="120"
    y="475"
    width="760"
    height="1"
    fill="url(#greenGlow)"
    opacity=".8"/>

</svg>
