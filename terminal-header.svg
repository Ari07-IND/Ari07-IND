<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1200 620"
  width="1200"
  height="620"
  font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Monaco, Consolas, Liberation Mono, monospace">

  <title>Aritra Chatterjee — AI / ML / Robotics / Research</title>

  <defs>

    <!-- Clean, deep dark background -->
    <linearGradient id="bgGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#090c10"/>
      <stop offset="1" stop-color="#010409"/>
    </linearGradient>

    <!-- Smooth gradient for the name -->
    <linearGradient id="nameGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b8ffc5"/>
      <stop offset="0.3" stop-color="#ffffff"/>
      <stop offset="0.7" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#7ee787"/>
    </linearGradient>

    <!-- Subtle bottom line gradient -->
    <linearGradient id="greenLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7ee787" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#7ee787" stop-opacity=".6"/>
      <stop offset="1" stop-color="#7ee787" stop-opacity="0"/>
    </linearGradient>

    <!-- Soft glow only for the most important text -->
    <filter id="nameGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="terminalClip">
      <rect x="25" y="25" width="1150" height="570" rx="15"/>
    </clipPath>

    <!-- Name Reveal Mask (Shifted up slightly for better cohesion) -->
    <clipPath id="nameReveal">
      <rect x="0" y="130" width="0" height="70">
        <animate attributeName="width" from="0" to="1120" dur="1.2s" begin="8.05s" fill="freeze"/>
      </rect>
    </clipPath>

    <!-- Profile Table Reveal Mask (Expanded height for table) -->
    <clipPath id="profileReveal">
      <rect x="0" y="210" width="0" height="230">
        <animate attributeName="width" from="0" to="1120" dur="1.1s" begin="10.35s" fill="freeze"/>
      </rect>
    </clipPath>

  </defs>

  <!-- Outer Shadow & Main Terminal Window -->
  <rect x="35" y="35" width="1150" height="570" rx="15" fill="#000000" opacity=".6"/>
  <rect x="25" y="25" width="1150" height="570" rx="15" fill="url(#bgGradient)" stroke="#30363d" stroke-width="1.5"/>

  <!-- Title Bar -->
  <rect x="25" y="25" width="1150" height="42" rx="15" fill="#161b22"/>
  <line x1="25" y1="67" x2="1175" y2="67" stroke="#30363d"/>

  <!-- MacOS Window Controls -->
  <circle cx="53" cy="46" r="6.5" fill="#ff5f56"/>
  <circle cx="76" cy="46" r="6.5" fill="#ffbd2e"/>
  <circle cx="99" cy="46" r="6.5" fill="#27c93f"/>

  <!-- Title & Telemetry -->
  <text x="600" y="50" text-anchor="middle" font-size="12.5" fill="#8b949e">aritra@github: ~ — zsh</text>
  
  <text x="940" y="50" font-size="11" fill="#484f58" letter-spacing="1">
    MEM: <tspan fill="#7ee787">18GB</tspan> / CPU: <tspan fill="#7ee787">12%</tspan>
  </text>

  <!-- Terminal Icon -->
  <g transform="translate(1120 37)" fill="none" stroke="#7ee787" stroke-width="1.5" opacity=".8">
    <rect x="0" y="0" width="30" height="18" rx="2"/>
    <path d="M6 6 L11 9 L6 12"/>
    <line x1="15" y1="13" x2="23" y2="13"/>
  </g>

  <!-- =========================================================
       BOOT SEQUENCE (Pure and simple text)
       ========================================================= -->
  <g id="bootSequence">
    <text x="60" y="105" font-size="15" font-weight="700" fill="#7ee787" opacity="0">
      &gt; INITIALIZING ARITRA.OS
      <animate attributeName="opacity" values="0;1" dur=".35s" begin=".4s" fill="freeze"/>
    </text>

    <text x="60" y="127" font-size="11" fill="#484f58" opacity="0">
      kernel :: ai-core / architecture :: human-intelligence interface
      <animate attributeName="opacity" values="0;1" dur=".3s" begin=".65s" fill="freeze"/>
    </text>

    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur=".3s" begin="1s" fill="freeze"/>
      <text x="60" y="162" font-size="13">
        <tspan fill="#7ee787">[ OK ]</tspan>
        <tspan fill="#484f58"> 0x00A1 </tspan>
        <tspan fill="#c9d1d9">kernel initialized</tspan>
        <tspan fill="#303b32"> ........................ </tspan>
        <tspan fill="#7ee787">READY</tspan>
      </text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur=".3s" begin="1.45s" fill="freeze"/>
      <text x="60" y="190" font-size="13">
        <tspan fill="#7ee787">[ OK ]</tspan>
        <tspan fill="#484f58"> 0x1B2C </tspan>
        <tspan fill="#c9d1d9">neural intelligence engine</tspan>
        <tspan fill="#303b32"> ........ </tspan>
        <tspan fill="#7ee787">READY</tspan>
      </text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur=".3s" begin="1.9s" fill="freeze"/>
      <text x="60" y="218" font-size="13">
        <tspan fill="#7ee787">[ OK ]</tspan>
        <tspan fill="#484f58"> 0x3F4A </tspan>
        <tspan fill="#c9d1d9">computer vision subsystem</tspan>
        <tspan fill="#303b32"> ......... </tspan>
        <tspan fill="#7ee787">READY</tspan>
      </text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur=".3s" begin="2.35s" fill="freeze"/>
      <text x="60" y="246" font-size="13">
        <tspan fill="#7ee787">[ OK ]</tspan>
        <tspan fill="#484f58"> 0x77DA </tspan>
        <tspan fill="#c9d1d9">robotics subsystem</tspan>
        <tspan fill="#303b32"> ................ </tspan>
        <tspan fill="#7ee787">READY</tspan>
      </text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur=".3s" begin="2.8s" fill="freeze"/>
      <text x="60" y="274" font-size="13">
        <tspan fill="#7ee787">[ OK ]</tspan>
        <tspan fill="#484f58"> 0x992B </tspan>
        <tspan fill="#c9d1d9">embedded intelligence</tspan>
        <tspan fill="#303b32"> ............. </tspan>
        <tspan fill="#7ee787">READY</tspan>
      </text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur=".3s" begin="3.25s" fill="freeze"/>
      <text x="60" y="302" font-size="13">
        <tspan fill="#7ee787">[ OK ]</tspan>
        <tspan fill="#484f58"> 0xFF00 </tspan>
        <tspan fill="#c9d1d9">research environment</tspan>
        <tspan fill="#303b32"> .............. </tspan>
        <tspan fill="#7ee787">READY</tspan>
      </text>
    </g>

    <text x="60" y="340" font-size="13" fill="#7ee787" opacity="0">
      BOOT PROGRESS
      <animate attributeName="opacity" values="0;1" dur=".3s" begin="3.55s" fill="freeze"/>
    </text>

    <rect x="190" y="331" width="620" height="11" rx="5" fill="#161b22" stroke="#30363d" opacity="0">
      <animate attributeName="opacity" values="0;1" dur=".3s" begin="3.55s" fill="freeze"/>
    </rect>

    <rect x="190" y="331" width="0" height="11" rx="5" fill="#7ee787">
      <animate attributeName="width" from="0" to="620" dur="1.55s" begin="3.6s" fill="freeze"/>
    </rect>

    <text x="830" y="340" font-size="12" fill="#7ee787" opacity="0">
      100%
      <animate attributeName="opacity" values="0;1" dur=".25s" begin="5.05s" fill="freeze"/>
    </text>

    <text x="60" y="382" font-size="16" font-weight="700" fill="#7ee787" opacity="0">
      SYSTEM BOOT COMPLETE
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.2;.7;1" dur="1.4s" begin="5.25s" fill="freeze"/>
    </text>

    <animate attributeName="opacity" values="1;1;1;0" keyTimes="0;.76;.88;1" dur="1.5s" begin="5.2s" fill="freeze"/>
  </g>

  <!-- =========================================================
       TERMINAL SESSION (MAIN CONTENT - CENTERED TELEMETRY)
       ========================================================= -->
  <g id="terminalSession" opacity="0">
    <animate attributeName="opacity" values="0;1" dur=".5s" begin="6.55s" fill="freeze"/>

    <!-- Command: whoami (Remains at top) -->
    <text x="60" y="95" font-size="16">
      <tspan fill="#7ee787" font-weight="700">aritra@github:~$</tspan>
      <tspan fill="#c9d1d9"> whoami</tspan>
    </text>

    <!-- Initial Cursor -->
    <rect x="310" y="81" width="9" height="18" fill="#7ee787">
      <animate attributeName="opacity" values="1;0;1;0" dur=".8s" begin="6.6s" repeatCount="4"/>
    </rect>

    <!-- CLEAN NAME REVEAL (Shifted up to maintain gap from whoami) -->
    <g clip-path="url(#nameReveal)">
      <text x="600" y="172" text-anchor="middle" font-size="52" font-weight="900" letter-spacing="7" fill="url(#nameGradient)" filter="url(#nameGlow)">
        ARITRA CHATTERJEE
      </text>
    </g>

    <!-- Identity Subtitle -->
    <text x="600" y="208" text-anchor="middle" font-size="12.5" letter-spacing="3" fill="#8b949e" opacity="0">
      ARI07-IND  //  CSE(AI)  //  IEM  //  UEM KOLKATA
      <animate attributeName="opacity" values="0;1" dur=".8s" begin="8.85s" fill="freeze"/>
    </text>

    <!-- Command: cat profile.json (Shifted up to y=250) -->
    <text x="60" y="250" font-size="16" opacity="0">
      <tspan fill="#7ee787" font-weight="700">aritra@github:~$</tspan>
      <tspan fill="#c9d1d9"> cat profile.json</tspan>
      <animate attributeName="opacity" values="0;1" dur=".4s" begin="9.55s" fill="freeze"/>
    </text>

    <!-- NEW: Center-Aligned Kernel Type ASCII Table Telemetry Reveal -->
    <g clip-path="url(#profileReveal)">
      
      <!-- Table Header Border -->
      <text x="600" y="280" text-anchor="middle" font-size="12.5" fill="#30363d">
        +------------------+-----------------------------+
      </text>
      
      <!-- Row 1: name -->
      <text x="380" y="300" font-size="12.5" fill="#30363d">
        | <tspan fill="#7ee787">[ OK ] name</tspan>       <tspan fill="#30363d">|</tspan> <tspan fill="#c9d1d9">Aritra Chatterjee</tspan>       <tspan fill="#30363d">|</tspan>
      </text>
      
      <!-- Row 2: education -->
      <text x="380" y="320" font-size="12.5" fill="#30363d">
        | <tspan fill="#7ee787">[ OK ] education</tspan>  <tspan fill="#30363d">|</tspan> <tspan fill="#c9d1d9">B.Tech CSE (AI)</tspan>           <tspan fill="#30363d">|</tspan>
      </text>
      
      <!-- Row 3: institute -->
      <text x="380" y="340" font-size="12.5" fill="#30363d">
        | <tspan fill="#7ee787">[ OK ] institute</tspan>  <tspan fill="#30363d">|</tspan> <tspan fill="#c9d1d9">IEM Newtown</tspan>               <tspan fill="#30363d">|</tspan>
      </text>
      
      <!-- Row 4: focus -->
      <text x="380" y="360" font-size="12.5" fill="#30363d">
        | <tspan fill="#7ee787">[ OK ] focus</tspan>      <tspan fill="#30363d">|</tspan> <tspan fill="#c9d1d9">Artificial Intelligence</tspan>   <tspan fill="#30363d">|</tspan>
      </text>
      
      <!-- Row 5: domains -->
      <text x="380" y="380" font-size="12.5" fill="#30363d">
        | <tspan fill="#7ee787">[ OK ] domains</tspan>    <tspan fill="#30363d">|</tspan> <tspan fill="#c9d1d9">AI / ML / Robotics</tspan>        <tspan fill="#30363d">|</tspan>
      </text>
      
      <!-- Row 6: status -->
      <text x="380" y="400" font-size="12.5" fill="#30363d">
        | <tspan fill="#ffffff">[BUILDING] status</tspan> <tspan fill="#30363d">|</tspan> <tspan fill="#7ee787">*ACTIVE*</tspan>                   <tspan fill="#30363d">|</tspan>
      </text>
      
      <!-- Table Footer Border -->
      <text x="600" y="420" text-anchor="middle" font-size="12.5" fill="#30363d">
        +------------------+-----------------------------+
      </text>

    </g>

    <!-- Final Prompt (Shifted down because table is taller than old JSON) -->
    <text x="60" y="460" font-size="15" opacity="0">
      <tspan fill="#7ee787" font-weight="700">aritra@github:~$</tspan>
      <tspan fill="#c9d1d9"> echo "always building."</tspan>
      <animate attributeName="opacity" values="0;1" dur=".45s" begin="11.65s" fill="freeze"/>
    </text>

    <!-- Final Blinking Cursor -->
    <rect x="360" y="446" width="9" height="17" rx="1" fill="#7ee787" opacity="0">
      <animate attributeName="opacity" values="0;1;0;1;0" dur="1s" begin="12s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Bottom Command Line Divider (Adjusted y=585 for cohesive spacing) -->
  <rect x="60" y="585" width="0" height="2" rx="1" fill="url(#greenLine)">
    <animate attributeName="width" from="0" to="1080" dur="1.4s" begin="6.6s" fill="freeze"/>
  </rect>

</svg>
